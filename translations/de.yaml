# The settings of the core about mail and the test mail (decision 0269).
"How the website sends mails, e.g. from forms. Without an SMTP server they go out with mail() of PHP.": "Wie die Website Mails verschickt, z. B. aus Formularen. Ohne SMTP-Server gehen sie mit mail() von PHP hinaus."
"Sender": "Absender"
"The address mails come from, best one of the SMTP account, e.g. info@example.org. mail.from in config/app.yaml goes first.": "Die Adresse, von der Mails kommen, am besten die des SMTP-Kontos, z. B. info@example.org. mail.from in config/app.yaml geht vor."
"SMTP server": "SMTP-Server"
"E.g. smtp.example.org. Empty: mails go out with mail() of PHP.": "Z. B. smtp.example.org. Leer: Mails gehen mit mail() von PHP hinaus."
"Port": "Port"
"587 starts encryption with STARTTLS, 465 is encrypted from the start.": "587 verschlüsselt per STARTTLS, 465 von Anfang an."
"User name": "Benutzername"
"Usually the email address of the account.": "Meist die E-Mail-Adresse des Kontos."
"The password of the SMTP account.": "Das Passwort des SMTP-Kontos."
