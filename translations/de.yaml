"With mail() of PHP": "Mit mail() von PHP"
"Mails go out over the web server. With the SMTP server of your mailbox they reach their recipients more reliably and less often land in spam.": "Mails gehen über den Webserver hinaus. Mit dem SMTP-Server Deines Postfachs erreichen sie ihre Empfänger zuverlässiger und landen seltener im Spam."
