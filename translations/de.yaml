# Users
Users: Benutzer
Who may sign in and what they may do.: Wer sich anmelden darf und was er darf.
New user: Neuer Benutzer
Name: Name
Disabled: Deaktiviert
Details: Angaben
May sign in: Darf sich anmelden
Without it the user is signed out and cannot sign in.: Ohne Haken wird der Benutzer abgemeldet und kann sich nicht anmelden.
The user signs in with it.: Damit meldet sich der Benutzer an.
At least 10 characters. Pass it on in person or by phone, not by email.: Mindestens 10 Zeichen. Gib es persönlich oder am Telefon weiter, nicht per E-Mail.
