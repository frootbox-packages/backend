# Roles
A role bundles permissions. Users manage users up to their own level.: Eine Rolle bündelt Rechte. Benutzer verwalten Benutzer bis zur eigenen Stufe.
New role: Neue Rolle
"{count} rule":
  one: "{count} Regel"
  other: "{count} Regeln"
Level {level}: Stufe {level}
Level: Stufe
Short name: Kurzname
Lowercase letters, digits and dashes, e.g. "author". It cannot be changed later.: Kleinbuchstaben, Ziffern und Bindestriche, z. B. „autor“. Er lässt sich später nicht ändern.
0 to 1000. Users manage users up to their own level and roles below it.: 0 bis 1000. Benutzer verwalten Benutzer bis zur eigenen Stufe und Rollen darunter.
Permissions: Rechte
'One rule per line: "page.*" allows everything with pages, "-page.delete" takes deleting away again, "*" allows everything.': "Eine Regel je Zeile: „page.*“ erlaubt alles mit Seiten, „-page.delete“ nimmt das Löschen wieder weg, „*“ erlaubt alles."
Create the role: Rolle anlegen
The role is created.: Die Rolle ist angelegt.
All permissions: Alle Rechte
Delete the role: Rolle löschen
Every user loses the role and its permissions.: Alle Benutzer verlieren die Rolle und ihre Rechte.
The role is deleted.: Die Rolle ist gelöscht.
