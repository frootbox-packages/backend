"Mails go out over {host} as MAILER_DSN in .env says. It goes before the settings here.": "Mails gehen über {host} hinaus, wie MAILER_DSN in .env es sagt. Das geht vor den Einstellungen hier."
"MAILER_DSN in .env decides how mails go out ({transport}). It goes before the settings here.": "MAILER_DSN in .env bestimmt, wie Mails hinausgehen ({transport}). Das geht vor den Einstellungen hier."
"Over SMTP": "Über SMTP"
