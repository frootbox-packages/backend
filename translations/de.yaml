"Its extension is not installed. Remove the block or install the extension again.": "Die Erweiterung dazu ist nicht installiert. Entferne den Block oder installiere die Erweiterung wieder."
Database: Datenbank
"Up to date": "Aktuell"
"{count} pending":
  one: "{count} ausstehend"
  other: "{count} ausstehend"
"All migrations of the core and the extensions have run.": "Alle Migrationen des Kerns und der Erweiterungen sind gelaufen."
"These migrations add the tables and columns the core and the extensions need. Run them before the website uses the new parts.": "Diese Migrationen ergänzen Tabellen und Spalten, die der Kern und die Erweiterungen brauchen. Führe sie aus, bevor die Website die neuen Teile nutzt."
"The database is up to date. A backup from before is in storage/backups/.": "Die Datenbank ist aktuell. Ein Backup von vorher liegt in storage/backups/."
"The database is up to date.": "Die Datenbank ist aktuell."
"Update now": "Jetzt aktualisieren"
"No backup can be made here before, e.g. without mysqldump. Make one by hand first, then update without a backup.": "Hier lässt sich vorher kein Backup anlegen, etwa ohne mysqldump. Sichere die Datenbank zuerst selbst und aktualisiere dann ohne Backup."
"Update without a backup": "Ohne Backup aktualisieren"
Cache: Cache
"After uploading changed templates or code without a console: empties var/cache. Pages, templates and lists are rebuilt on the next visit, the first one takes a little longer.": "Nach dem Hochladen geänderter Templates oder geänderten Codes ohne Konsole: leert var/cache. Seiten, Templates und Listen entstehen beim nächsten Aufruf neu, der erste dauert etwas länger."
"Clear the cache": "Cache leeren"
"The cache is empty.": "Der Cache ist leer."
"Update the database without a backup?": "Datenbank ohne Backup aktualisieren?"
"If a migration fails, there is no state from before to go back to.": "Scheitert eine Migration, gibt es keinen Stand von vorher, zu dem Du zurückkannst."
"{count} migration is pending":
  one: "{count} Migration steht aus"
  other: "{count} Migrationen stehen aus"
"The database is missing tables or columns of the core or an extension. Bring it up to date under Extensions.": "Der Datenbank fehlen Tabellen oder Spalten des Kerns oder einer Erweiterung. Bring sie unter Erweiterungen auf den neuen Stand."
"To the database": "Zur Datenbank"
"The backup failed, so nothing was migrated: {error}": "Das Backup ist gescheitert, deshalb ist nichts migriert: {error}"
# The connection to the hub, frootbox.de (decision 0284)
"Connection": "Verbindung"
"the hub": "dem Dienst"
"Connected with {hub}, the agency sees the state of this website in its account area: version, cron, backups. The website decides what {hub} may do.": "Mit {hub} verbunden, sieht die Agentur den Zustand dieser Website in ihrem Kontobereich: Version, Cron, Backups. Was {hub} darf, entscheidet die Website."
"Connection with {hub}": "Verbindung mit {hub}"
"Connected": "Verbunden"
"Waiting for confirmation": "Wartet auf Bestätigung"
"Not connected": "Nicht verbunden"
"Organization": "Organisation"
"Connected since": "Verbunden seit"
"Status last read": "Status zuletzt abgefragt"
"not yet": "noch nicht"
"Let {hub} read the status": "{hub} darf den Status abfragen"
"Off, the token of {hub} stops working at once.": "Aus, gilt das Token von {hub} sofort nicht mehr."
"Saved.": "Gespeichert."
"Disconnect": "Trennen"
"{hub} confirmed the connection": "{hub} hat die Verbindung bestätigt"
"Complete it here. Only then does {hub} get access.": "Schließ sie hier ab. Erst dann bekommt {hub} Zugang."
"The website is connected.": "Die Website ist verbunden."
"Complete the connection": "Verbindung abschließen"
"A request waits for the confirmation on {hub} until {time}.": "Eine Anfrage wartet bis {time} auf die Bestätigung bei {hub}."
"Continue on {hub}": "Weiter bei {hub}"
"The request is cancelled.": "Die Anfrage ist abgebrochen."
"Cancel the request": "Anfrage abbrechen"
"Without APP_SECRET in .env the website cannot keep its key, so it cannot connect.": "Ohne APP_SECRET in der .env kann die Website ihren Schlüssel nicht aufbewahren und sich deshalb nicht verbinden."
"Set the address of the website as \"app.url\" in config/app.yaml first.": "Trag zuerst die Adresse der Website als „app.url“ in config/app.yaml ein."
"{site} is a local address. Connect the website live or on staging, where {hub} can reach it.": "{site} ist eine lokale Adresse. Verbinde die Website live oder auf Staging, wo {hub} sie erreicht."
"\"hub.url\" in config/app.yaml is no valid address.": "„hub.url“ in config/app.yaml ist keine gültige Adresse."
"Cannot connect yet": "Verbinden geht noch nicht"
"You sign in on {hub}, choose the organization and confirm. {hub} then checks that the website is reachable at {site}.": "Du meldest Dich bei {hub} an, wählst die Organisation und bestätigst. {hub} prüft dann, dass die Website unter {site} erreichbar ist."
"What {hub} sees is shown below. You can turn it off at any time.": "Was {hub} sieht, steht unten. Du kannst es jederzeit abschalten."
"Connect with {hub}": "Mit {hub} verbinden"
"What {hub} sees": "Was {hub} sieht"
"The status is off: {hub} sees nothing but the connection.": "Der Status ist abgeschaltet: {hub} sieht nur die Verbindung."
"Exactly this, as often as {hub} asks, from {url}. No names, emails, content or addresses of pages.": "Genau das, so oft {hub} fragt, unter {url}. Keine Namen, Mails, Inhalte oder Adressen von Seiten."
"With the status on, {hub} reads exactly this. No names, emails, content or addresses of pages.": "Mit eingeschaltetem Status liest {hub} genau das. Keine Namen, Mails, Inhalte oder Adressen von Seiten."
"Key of the website: {key}": "Schlüssel der Website: {key}"
"The website is disconnected.": "Die Website ist getrennt."
"Disconnect from {hub}?": "Von {hub} trennen?"
"The access of {hub} ends at once. The agency no longer sees this website until it connects again.": "Der Zugang von {hub} endet sofort. Die Agentur sieht diese Website erst wieder, wenn sie sich neu verbindet."
"Without APP_SECRET in .env the key of the website cannot be stored, so it cannot connect.": "Ohne APP_SECRET in der .env lässt sich der Schlüssel der Website nicht speichern, deshalb kann sie sich nicht verbinden."
"The address of the website is missing: set \"app.url\" in config/app.yaml.": "Die Adresse der Website fehlt: Trag „app.url“ in config/app.yaml ein."
"\"hub.url\" in config/app.yaml must be an address like https://hub.frootbox.de, not \"{url}\".": "„hub.url“ in config/app.yaml muss eine Adresse wie https://hub.frootbox.de sein, nicht „{url}“."
"The website is connected already. Disconnect it first.": "Die Website ist schon verbunden. Trenn sie zuerst."
"The website is not connected.": "Die Website ist nicht verbunden."
"No request waits for this confirmation, or it has expired. Connect again.": "Für diese Bestätigung wartet keine Anfrage, oder sie ist abgelaufen. Verbinde neu."
"The key of the website cannot be read, e.g. because APP_SECRET changed. Disconnect and connect again.": "Der Schlüssel der Website lässt sich nicht lesen, z. B. weil sich APP_SECRET geändert hat. Trenn die Verbindung und verbinde neu."
"The hub at {url} cannot be reached. Try again later.": "Der Dienst unter {url} ist nicht erreichbar. Versuch es später noch einmal."
"The hub refused ({status}): {detail}": "Der Dienst hat abgelehnt ({status}): {detail}"
"The hub answered without {what}.": "Der Dienst hat ohne {what} geantwortet."
"must be an address of this website, {site}/….": "muss eine Adresse dieser Website sein, {site}/…."
